<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>His Majesty Muedzul Lail Tan Kiram, 35th Sultan of Sulu</title>
<meta name="description" content="The official site of His Majesty Muedzul Lail Tan Kiram, 35th Sultan of Sulu and Head of the Royal House of the Sultanate of Sulu.">

<meta property="og:type" content="website">
<meta property="og:url" content="https://sultanmuedzul.com/">

<meta property="og:description" content="The official site of His Majesty Muedzul Lail Tan Kiram, 35th Sultan of Sulu and Head of the Royal House of the Sultanate of Sulu.">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Jost:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--green:#0b2a1d;--cream:#f4efe4;--cream-2:#ebe4d4;--gold-lt:#e4c46a;--rule:rgba(11,42,29,.18)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--green);color:var(--cream);-webkit-font-smoothing:antialiased}
  /* footer always sits at the bottom, even on a tall screen */
  body{min-height:100vh;display:flex;flex-direction:column}
  main{flex:1 0 auto}
  img{display:block;max-width:100%}
  .caps{font-family:Jost,Helvetica,Arial,sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.3em;font-size:12px}
  .hero{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:100px 24px 120px}
  .hero::before{content:"";position:absolute;inset:0;background:rgba(7,30,20,.22);z-index:1}
  .art{position:absolute;top:0;bottom:0;right:4%;height:100%;aspect-ratio:1200/1591;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 75%,transparent),linear-gradient(#000 70%,transparent);
    -webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 30%,#000 75%,transparent),linear-gradient(#000 70%,transparent);mask-composite:intersect}
  .art img{width:100%;height:100%;object-fit:cover}
  .copy{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:min(780px,100%);margin-right:min(40%,540px)}
  .crest{width:74px;margin-bottom:30px}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(32px,3.5vw,50px);line-height:1.15;margin-bottom:20px;text-wrap:balance}
  .styled{letter-spacing:.34em}
  .styled em{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;text-transform:none;letter-spacing:.04em;font-size:1.25em}
  /* quiet link under the title: a short gold rule, then small capitals */
  .more{margin-top:46px;display:inline-flex;flex-direction:column;align-items:center;gap:18px;color:var(--gold-lt);text-decoration:none}
  .more::before{content:"";width:44px;height:1px;background:rgba(228,196,106,.55)}
  .more span{font-size:11px;letter-spacing:.3em;border-bottom:1px solid transparent;padding-bottom:4px;transition:border-color .25s}
  .more:hover span,.more:focus-visible span{border-color:rgba(228,196,106,.7)}
  .more:focus-visible{outline:2px solid var(--gold-lt);outline-offset:8px}
  /* footer: three symbols from the flag, then copyright and contact */
  .site-footer{background:var(--cream-2);color:var(--green);padding:0 18px 26px}
  .foot-cols{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:56px 0}
  .foot-col{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:4px 20px}
  .foot-col+.foot-col{border-left:1px solid var(--rule)}
  .foot-col .caps{font-size:10px;line-height:1.7;letter-spacing:.26em}
  .foot-col .serif{font-family:"Cormorant Garamond",Georgia,serif;text-transform:uppercase;letter-spacing:.08em;font-size:19px;line-height:1.2}
  .foot-col .serif em{text-transform:none;font-size:.85em}
  a.foot-col{color:inherit;text-decoration:none}
  a.foot-col span{border-bottom:1px solid transparent;padding-bottom:3px;transition:border-color .25s}
  a.foot-col:hover span,a.foot-col:focus-visible span{border-color:rgba(11,42,29,.4)}
  a.foot-col:focus-visible{outline:2px solid #a8841f;outline-offset:6px}
  .foot-base{display:flex;align-items:center;gap:26px;border-top:1px solid var(--rule);padding-top:22px}
  .foot-base::before,.foot-base::after{content:"";flex:1}
  .foot-base .caps{font-size:10px;letter-spacing:.24em;display:flex;gap:22px;flex-wrap:wrap;justify-content:center;text-align:center}
  .foot-base a{color:inherit;text-decoration:none;text-transform:none;letter-spacing:.14em;font-size:12px;border-bottom:1px solid rgba(11,42,29,.35);padding-bottom:2px}
  .foot-base a:hover,.foot-base a:focus-visible{border-color:var(--green)}
  .foot-base a:focus-visible{outline:2px solid #a8841f;outline-offset:5px}
  /* phones and small tablets: portrait on top, name and address underneath */
  @media (max-width:820px){
    .hero{justify-content:flex-start;min-height:0;padding:0 16px 64px}
    .hero::before{display:none}
    .art{position:relative;right:auto;top:auto;bottom:auto;height:auto;width:min(100%,520px);
      -webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent),linear-gradient(#000 62%,transparent);
      mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent),linear-gradient(#000 62%,transparent)}
    .copy{margin:-70px 0 0}
    .crest{width:60px;margin-bottom:22px}
    .foot-cols{grid-template-columns:1fr;gap:30px;padding:44px 0}
    .foot-col+.foot-col{border-left:0;border-top:1px solid var(--rule);padding-top:30px}
  }

</style>
</head>
<body>
<main class="hero">
  <div class="art"><img src="img/portrait/oil-portrait.jpg" alt="Painted portrait of His Majesty Muedzul Lail Tan Kiram" width="1200" height="1591" fetchpriority="high"></div>
  <div class="copy">
    <img class="crest" src="img/emblem-light.png" alt="Royal emblem of the Sultanate of Sulu" width="74" height="75">
    <h1>His Majesty<br>Muedzul Lail Tan Kiram</h1>
    <p class="caps styled">35th Sultan <em>of</em> Sulu</p>
    <a class="caps more" href="sultanate.html"><span>The Sultanate of Sulu</span></a>
  </div>
</main>
<footer class="site-footer">
  <div class="foot-cols">
    <div class="foot-col"><img src="img/kris-spear-deep.png" alt="Kris and spear" width="120" height="22"><span class="caps">The Royal House</span></div>
    <a class="foot-col" href="index.html"><img src="img/emblem-deep.png" alt="" width="40" height="41"><span class="caps">His Majesty the Sultan of Sulu<br>Head of the Royal House</span></a>
    <a class="foot-col" href="sultanate.html"><img src="img/crescent-star-gold.svg" alt="" width="34" height="34"><span class="serif">Sultanate <em>of</em> Sulu</span></a>
  </div>
  <div class="foot-base"><p class="caps"><span>&copy; 2026. All rights reserved.</span><a href="mailto:contact@sultanmuedzul.com">contact@sultanmuedzul.com</a></p></div>
</footer>
</body>
</html>
