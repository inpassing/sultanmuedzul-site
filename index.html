<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>His Majesty Muedzul Lail Tan Kiram, 35th Sultan of Sulu</title>
<meta name="description" content="The official site of His Majesty Muedzul Lail Tan Kiram, 35th Sultan of Sulu and Head of the Royal House of the Sultanate of Sulu.">
<meta name="theme-color" content="#0b2a1d">
<link rel="canonical" href="https://sultanmuedzul.com/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sultanmuedzul.com/">
<meta property="og:title" content="His Majesty Muedzul Lail Tan Kiram, 35th Sultan of Sulu">
<meta property="og:description" content="The official site of His Majesty Muedzul Lail Tan Kiram, 35th Sultan of Sulu and Head of the Royal House of the Sultanate of Sulu.">
<meta property="og:image" content="https://sultanmuedzul.com/img/portrait/oil-portrait.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/emblem-gold.png">
<link rel="apple-touch-icon" href="img/emblem-gold.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Jost:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--green:#0b2a1d;--cream:#f4efe4;--gold-lt:#e4c46a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--green);color:var(--cream);-webkit-font-smoothing:antialiased}
  img{display:block;max-width:100%}
  .caps{font-family:Jost,Helvetica,Arial,sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.3em;font-size:12px}
  .hero{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:100px 24px 120px}
  .hero::before{content:"";position:absolute;inset:0;background:rgba(7,30,20,.22);z-index:1}
  .art{position:absolute;top:0;bottom:0;right:4%;height:100%;aspect-ratio:1200/1591;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 75%,transparent),linear-gradient(#000 70%,transparent);
    -webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 30%,#000 75%,transparent),linear-gradient(#000 70%,transparent);mask-composite:intersect}
  .art img{width:100%;height:100%;object-fit:cover}
  .copy{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:min(780px,100%);margin-right:min(40%,540px)}
  .crest{width:74px;margin-bottom:30px}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(32px,3.5vw,50px);line-height:1.15;margin-bottom:20px;text-wrap:balance}
  .styled{letter-spacing:.34em}
  .styled em{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;text-transform:none;letter-spacing:.04em;font-size:1.25em}
  .mail{margin-top:52px;color:var(--gold-lt);text-decoration:none;letter-spacing:.22em;text-transform:none;font-size:13px;border-bottom:1px solid rgba(228,196,106,.4);padding-bottom:4px}
  .mail:hover,.mail:focus-visible{border-color:var(--gold-lt)}
  .mail:focus-visible{outline:2px solid var(--gold-lt);outline-offset:6px}
  .foot{position:absolute;left:0;right:0;bottom:26px;z-index:2;font-size:10px;opacity:.6;letter-spacing:.26em}
  /* phones and small tablets: portrait on top, name and address underneath */
  @media (max-width:820px){
    .hero{justify-content:flex-start;padding:0 16px 90px}
    .hero::before{display:none}
    .art{position:relative;right:auto;top:auto;bottom:auto;height:auto;width:min(100%,520px);
      -webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent),linear-gradient(#000 62%,transparent);
      mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent),linear-gradient(#000 62%,transparent)}
    .copy{margin:-70px 0 0}
    .crest{width:60px;margin-bottom:22px}
    .mail{margin-top:40px}
  }
</style>
</head>
<body>
<main class="hero">
  <div class="art"><img src="img/portrait/oil-portrait.jpg" alt="Painted portrait of His Majesty Muedzul Lail Tan Kiram" width="1200" height="1591" fetchpriority="high"></div>
  <div class="copy">
    <img class="crest" src="img/emblem-light.png" alt="Royal emblem of the Sultanate of Sulu" width="74" height="75">
    <h1>His Majesty<br>Muedzul Lail Tan Kiram</h1>
    <p class="caps styled">35th Sultan <em>of</em> Sulu</p>
    <a class="caps mail" href="mailto:contact@sultanmuedzul.com">contact@sultanmuedzul.com</a>
  </div>
  <p class="caps foot">&copy; 2026 The Royal House of the Sultanate of Sulu</p>
</main>
</body>
</html>
